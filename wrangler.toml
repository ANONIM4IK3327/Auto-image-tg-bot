name = "auto-image-tg-bot"
main = "worker.js"
compatibility_date = "2024-12-01"

# Cron: каждую минуту проверяет pending и отправляет новые
[triggers]
crons = ["* * * * *"]

# KV для хранения конфигурации и состояния
[[kv_namespaces]]
binding = "telegram-bot-kv"
id = "telegram-bot-kv"

# Обычные переменные (не секреты)
[vars]
LLM_MODEL = "meta-llama/llama-3.1-8b-instruct:free"
